name: Temporary MovNet Builder

on:
  workflow_dispatch:
  pull_request_target:
    branches:
      - claude/android-app-guidance-jo1f35
    types: [opened, synchronize, reopened]

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'movnet-apk-build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MovNet build branch
        uses: actions/checkout@v4
        with:
          ref: movnet-apk-build

      - name: Restore MovNet project
        run: |
          mkdir -p movnet
          base64 -d movnet-project.b64 > movnet/project.zip
          unzip -q movnet/project.zip -d movnet

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle -p movnet :app:assembleDebug --stacktrace

      - name: Build release AAB
        run: gradle -p movnet :app:bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MovNet-debug-apk
          path: movnet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: MovNet-release-aab
          path: movnet/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
